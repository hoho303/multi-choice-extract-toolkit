services:
  postgres:
    image: postgres:16-alpine
    container_name: mcq-postgres
    restart: unless-stopped
    ports:
      - "${PG_PORT_DB:-5432}:5432"
    environment:
      POSTGRES_USER: ${PG_USERNAME_DB:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD_DB:-postgres}
      POSTGRES_DB: ${PG_DATABASE:-mcq_extractor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mcq_net

  redis:
    image: redis:7-alpine
    container_name: mcq-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - mcq_net

  rabbitmq:
    image: rabbitmq:4.1.5-management-alpine
    container_name: mcq-rabbitmq
    hostname: mcq-rabbitmq-host
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    networks:
      - mcq_net

  api-gateway:
    build:
      context: .
      dockerfile: ./api_gateway/Dockerfile
    image: mcq-api-gateway
    container_name: mcq-api-gateway
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-7000}:7000"
    networks:
      - mcq_net
    environment:
      TZ: Asia/Ho_Chi_Minh
      PYTHONUNBUFFERED: 1
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      PG_USERNAME_DB: ${PG_USERNAME_DB:-postgres}
      PG_PASSWORD_DB: ${PG_PASSWORD_DB:-postgres}
      PG_HOST_DB: postgres
      PG_PORT_DB: 5432
      PG_DATABASE: ${PG_DATABASE:-mcq_extractor}
    depends_on:
      - postgres
      - redis
      - rabbitmq

  celery-worker:
    build:
      context: .
      dockerfile: ./celery_worker/Dockerfile
    image: mcq-celery-worker
    container_name: mcq-celery-worker
    command: >
      sh -c "celery -A app.celery_app:celery worker --loglevel=INFO --concurrency=4"
    restart: unless-stopped
    networks:
      - mcq_net
    environment:
      TZ: Asia/Ho_Chi_Minh
      PYTHONUNBUFFERED: 1
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PG_USERNAME_DB: ${PG_USERNAME_DB:-postgres}
      PG_PASSWORD_DB: ${PG_PASSWORD_DB:-postgres}
      PG_HOST_DB: postgres
      PG_PORT_DB: 5432
      PG_DATABASE: ${PG_DATABASE:-mcq_extractor}
      BASE_SAVE_DIR: ${BASE_SAVE_DIR:-temp}
    depends_on:
      - postgres
      - redis
      - rabbitmq

  upload-document:
    build:
      context: .
      dockerfile: ./upload_document/Dockerfile
    image: mcq-upload-document
    container_name: mcq-upload-document
    restart: unless-stopped
    ports:
      - "${UPLOAD_PORT:-7002}:7002"
    networks:
      - mcq_net
    volumes:
      - upload_data:/upload_document/uploads
    environment:
      TZ: Asia/Ho_Chi_Minh
      PYTHONUNBUFFERED: 1
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  upload_data:
    driver: local

networks:
  mcq_net:
    driver: bridge
