    "celery[auth,gevent,librabbitmq,msgpack,redis]>=5.5.3",
    "dotenv>=0.9.9",
    "fastapi>=0.121.0",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "psycopg2-binary>=2.9.11",
    "psycopg[binary]>=3.2.12",
    "pydantic[email]>=2.12.4",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
    "python-jose[cryptography]>=3.5.0",
    "pyjwt>=2.10.1",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.20",
    "requests>=2.32.5",
    "pillow>=12.0.0",
    "google-genai>=1.49.0",
    "openai>=2.7.1",
    "pdf2image>=1.17.0",
    "pymupdf>=1.26.6",
    "certifi>=2025.10.5",
